model: "adaptive_quiz_engine"
core_function: "determine_student_progression"
description: >
  An adaptive quiz engine that adjusts difficulty and determines intervention needs based on student performance. The system tracks streaks, confidence levels, and response times to make progression decisions. When students struggle severely, the system can trigger an emergency reset. The core challenge lies in balancing multiple factors: maintaining appropriate difficulty, identifying when students need help, and handling edge cases in performance data that create ambiguous states.

questions:
  q1: "How many distinct progression scenarios exist in determine_student_progression, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can a student with current_streak >= 3 ever trigger an emergency reset? If so, under what exact conditions?"
  q3: "Can the safety property 'emergency reset always sets difficulty to Easy and enables intervention' ever be violated? Include any edge cases or boundary conditions where violations might occur."
