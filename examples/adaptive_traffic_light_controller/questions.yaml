model: "adaptive_traffic_light_controller"
core_function: "determine_phase_action"
description: >
  An adaptive traffic light controller that manages intersection timing based on traffic conditions, emergency vehicles, and pedestrian needs. The system can override normal operations for emergencies, extend phases when needed, and transition between light states. The core challenge involves coordinating multiple factors: emergency override logic, phase extension criteria, timing calculations, and handling edge cases where traffic conditions create ambiguous decision states.

questions:
  q1: "How many distinct phase action scenarios exist in determine_phase_action, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can the system trigger EmergencyOverride when both lights are Red (Red-Red state)? If so, under what conditions?"
  q3: "Can the safety property 'emergency override always sets NS to Green, EW to Red, and duration to 15' ever be violated? Include any edge cases or boundary conditions."
