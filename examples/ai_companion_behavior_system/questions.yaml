model: "ai_companion_behavior_system"
core_function: "determine_companion_behavior"
description: >
  An AI companion behavior system that determines companion actions based on loyalty, mood, trust, and context. The system manages complex interactions between personality traits, emotional states, and situational factors to decide whether companions will comply with orders, perform effectively, or even abandon the player. The core challenge involves balancing multiple behavioral factors and handling edge cases where companion states create ambiguous decision scenarios.

questions:
  q1: "How many distinct behavior scenarios exist in determine_companion_behavior, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can a Devoted companion (highest loyal level below Fanatical) ever choose to LeaveParty? If so, under what exact conditions?"
  q3: "Can the safety property 'companions with abandonment_risk >= 75 always choose LeaveParty (unless invalid state)' ever be violated? Include edge cases."
