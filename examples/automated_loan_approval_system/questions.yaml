model: "automated_loan_approval_system"
core_function: "determine_loan_approval"
description: >
  An automated loan approval system that evaluates applications based on credit score, debt-to-income ratio, employment, and collateral. The system performs risk assessment, validates regulatory limits, and determines whether loans can be auto-approved, require conditions, or need manual review. The core challenge involves balancing multiple approval criteria while handling edge cases where applicant profiles create ambiguous decision scenarios.

questions:
  q1: "How many distinct approval scenarios exist in determine_loan_approval, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can an applicant with Excellent credit (score >= 750) ever receive ManualReviewRequired decision? If so, under what exact conditions?"
  q3: "Can the safety property 'applications with ManualReviewRequired are never auto-approved' ever be violated? Include edge cases."
