model: "automotive_assembly"
core_function: "determine_station_processing"
description: >
  An automotive assembly line system that determines whether a station can process vehicles based on equipment status, worker availability, capacity constraints, and safety conditions. The system manages quality gates, emergency stops, and maintenance requirements. The core challenge involves coordinating multiple operational factors while handling edge cases where station configurations create ambiguous decision states.

questions:
