model: "autonomous_tractor_fleet_coordination"
core_function: "determine_task_assignment"
description: >
  An autonomous tractor fleet coordination system that assigns agricultural tasks to tractors based on operational readiness, weather conditions, fuel levels, maintenance needs, and collision avoidance. The system must balance task priorities with resource constraints, handle weather-dependent operations (e.g., no spraying in rain), avoid collision zones, and implement a readiness quorum requiring 3 out of 4 conditions for task assignment.

questions:
  q1: "How many distinct task assignment scenarios exist in determine_task_assignment, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can a Spraying task be assigned (can_proceed=true) when weather is Rainy with full fuel and all equipment available? If so, under what exact conditions?"
  q3: "Can the safety property 'collision zone (collision_active && distance < 50) should always result in Abort_Collision decision' ever be violated? If so, under what exact conditions?"
