model: "bgp_path_vector_routing"
core_function: "select_best_route"
description: >
  BGP (Border Gateway Protocol) route selection logic that determines which of two routes should be preferred for a given destination. The system implements the standard BGP best path selection algorithm with local preference, AS path length, origin type, and MED comparison. The model incorporates emergency override (Pattern 1), MED comparison mode multiplexing (Pattern 2), and AS path dead zones (Pattern 3) to create interesting interaction patterns that challenge exhaustive enumeration.

questions:
  q1: "How many distinct route selection scenarios exist in the BGP decision process, and how many of these involve MED (Multi-Exit Discriminator) comparison?"
  q2: "Can a route with lower local_pref ever beat a route with higher local_pref? If yes, under what exact conditions?"
  q3: "Can routes in the dead zone (AS path 250-254 with MED 95-105) ever be selected as the best route?"
