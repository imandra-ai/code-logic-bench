model: "coastal_erosion_monitoring_and_alert_system"
core_function: "determine_alert"
description: >
  A coastal erosion monitoring system that determines alert levels and evacuation decisions based on erosion rate measurements, wave height, coastal geography type, sensor status, and infrastructure criticality. The system must handle sensor failures, apply coastal-type-specific thresholds, detect dangerous quorum conditions, and issue appropriate warnings from Normal through Emergency evacuation alerts.

questions:
  q1: "How many distinct alert scenarios exist in determine_alert, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Under what exact conditions does the system trigger evacuation (evacuate=true)? Describe all combinations."
  q3: "Can the safety property 'failed sensors should never produce Emergency alert' ever be violated? If so, under what exact conditions?"
