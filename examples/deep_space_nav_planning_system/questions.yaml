model: "deep_space_nav_planning_system"
core_function: "determine_trajectory"
description: >
  A deep space navigation planning system that determines spacecraft trajectory maneuvers based on navigation state, distance to target, velocity, fuel level, and trajectory clearance. The system must handle emergency modes, orbital insertion challenges, fuel-dependent propulsion selection, and safety quorum checks requiring 3 out of 4 safety conditions for maneuver approval.

questions:
  q1: "How many distinct trajectory decision scenarios exist in determine_trajectory, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Under what exact conditions does the system trigger Aerobrake maneuver? Can it happen with Abundant fuel?"
  q3: "Can the safety property 'Emergency navigation state should always result in propulsion Off' ever be violated? If so, under what exact conditions?"
