      - **High price IS required** for this path.


      So Battery does NOT always need high price to receive DISCHARGE. In EMERGENCY
      conditions, price is irrelevant (except for dead zone avoidance).
    reasoning: >-
      - There are exactly two return statements that give Battery a DISCHARGE command.

      - Path 1 (Emergency): The code checks grid_condition == EMERGENCY first (after
      dead zone). For BATTERY, it immediately returns DISCHARGE with power=50. No
