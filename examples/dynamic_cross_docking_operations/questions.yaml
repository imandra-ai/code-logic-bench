model: "dynamic_cross_docking_operations"
core_function: "determine_routing_decision"
description: >
  A dynamic cross-docking system that routes products from inbound to outbound docks based on product characteristics (type, temperature requirements, volume), dock availability and capacity, and priority levels. The system must handle temperature zone compatibility, capacity constraints, and emergency routing scenarios. Critical decisions include when to trigger emergency overrides (bypassing normal capacity limits), how to route products through maintenance docks, and how temperature zones affect handling times. The core challenge lies in the interaction between priority-based capacity adjustments, temperature compatibility rules, and emergency override conditions that form a quorum (3 out of 4 factors).

questions:
  q1: "How many distinct routing scenarios exist in determine_routing_decision, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can a Hazardous product ever be routed to a dock in Maintenance status? If so, under what exact conditions?"
  q3: "Can the safety property 'Hazardous products routed to maintenance docks must have emergency override' ever be violated? If so, under what exact conditions? Include any edge cases."
