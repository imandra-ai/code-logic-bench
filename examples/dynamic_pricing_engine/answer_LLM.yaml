      - For all valid paths (price_valid=True) where total_discount=VERY_LARGE and
      cost_high=True, margin_enforced is always True. The safety property holds on
      valid paths.

      - The only "violations" occur on invalid paths (dead zones, out of stock) where
      price_valid=False, which could be considered edge cases worth noting.
