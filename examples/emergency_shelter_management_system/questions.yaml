model: "emergency_shelter_management_system"
core_function: "determine_assignment"
description: >
  Emergency shelter assignment system that determines evacuee placement based on priority, medical needs, weather conditions, and shelter capacity. Uses quorum pattern for emergency overrides, multiplexer for shelter type selection, and priority escalation when capacity is constrained.

questions:
  q1: "How many distinct assignment scenarios exist?"
  q2: "Can Critical priority evacuees with medical needs ever be rejected?"
  q3: "Does Extreme weather with Critical priority always get approved?"
