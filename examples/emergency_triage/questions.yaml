model: "emergency_triage"
core_function: "determine_esi"
description: >
  Emergency triage system using ESI (Emergency Severity Index) to classify patients based on vital signs, pain level, age, and arrival mode. Features quorum-based high-risk detection (2 of 4 conditions), helicopter arrival upgrade override, dead zone for ambiguous presentations, and layered ESI upgrades through multiple decision points.

questions:
  q1: "How many distinct ESI triage scenarios exist in determine_esi?"
  q2: "Can an ESI_4 or ESI_5 patient be upgraded to ESI_2 through the high-risk quorum mechanism? If so, under what exact conditions?"
  q3: "Can the safety property 'critical vitals always result in ESI_1' ever be violated? Include boundary cases and upgrade interactions."
