model: "flight_management_system_controller"
core_function: "determine_ap_mode"
description: >
  Flight management autopilot mode controller that determines AP engagement based on flight phase, system health, altitude state, and weather conditions. Features quorum-based emergency disconnect (2 of 4 conditions), weather-dependent capability multiplexing, approach phase monitoring override, and dead zones for ambiguous altitude+phase+weather combinations.

questions:
