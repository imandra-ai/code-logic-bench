model: "gdpr_compliance_engine"
core_function: "determine_gdpr_compliance"
description: >
  A GDPR compliance engine that evaluates whether data processing activities comply with EU data protection regulations. The system must determine if a lawful basis is sufficient for processing different categories of personal data (Personal, Sensitive, Biometric, Health, Financial), check consent validity with time decay, validate cross-border data transfers with varying safeguard requirements, and assess risk levels based on multiple factors. The core challenge lies in handling override patterns where certain lawful bases (LegalObligation, VitalInterests) generally allow processing but have specific exceptions for sensitive data and automated decision-making, multiplexer logic where data categories change safeguard score thresholds, and quorum-based risk assessment requiring multiple factors to align.

questions:
  q1: "How many distinct GDPR compliance scenarios exist in determine_gdpr_compliance, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can processing with lawful_basis=LegalObligation ever be rejected? If so, under what exact conditions?"
  q3: "Can the safety property 'Critical risk always requires DPO review' ever be violated? If so, under what exact conditions? Include any edge cases or boundary conditions where violations might occur."
