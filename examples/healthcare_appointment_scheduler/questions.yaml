model: "healthcare_appointment_scheduler"
core_function: "determine_appointment_decision"
description: >
  Healthcare appointment scheduling system that determines whether to approve, waitlist, or reject appointment requests based on patient insurance status, no-show history, appointment priority, and system constraints. The model implements insurance verification with provider- specific rules, emergency override patterns, scheduling dead zones during lunch hours, and a quorum-based approval system requiring multiple conditions to be satisfied.

questions:
  q1: "How many distinct appointment scheduling decision scenarios exist across all combinations of patient, request, and system parameters?"
  q2: "Can Routine (non-emergency) appointments ever be approved when patient insurance status is Pending? If yes, under what exact conditions?"
  q3: "Can Emergency priority appointments with 3 or more no-shows ever be approved? Verify the safety property."
