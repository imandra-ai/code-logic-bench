model: "infusion_pump_controller"
core_function: "determine_infusion_safety"
description: >
  An infusion pump safety controller that determines whether to allow medication infusions based on drug class (Opioid, Vasopressor, Fluid), patient risk level, patient weight, hardware status, and requested infusion rate. The system must calculate safe rate limits that vary by drug class and patient parameters, handle hardware degradation with special rules for critical drugs, and trigger alarms when multiple risk factors align. The core challenge lies in the override pattern where degraded hardware normally restricts high rates BUT critical drugs for high-risk patients override this restriction, multiplexer logic where different drug classes have different weight-adjustment formulas, and quorum-based alarm triggering requiring 2-out-of-4 risk factors.

questions:
  q1: "How many distinct infusion safety scenarios exist in determine_infusion_safety, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can the pump allow infusion when hardware status is Critical? If so, under what exact conditions?"
  q3: "Can a HighRisk patient receiving a critical drug ever avoid requiring double-check verification? If so, under what exact conditions? Include any edge cases."
