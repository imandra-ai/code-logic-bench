model: "lab_sample_processing_workflow"
core_function: "determine_processing_decision"
description: >
  Laboratory sample processing authorization system that determines whether to approve, quarantine, or reject sample processing requests based on sample type, user clearance, temperature compliance, contamination levels, and time constraints. The model implements priority override for urgent samples, type-dependent clearance requirements, temperature dead zones for borderline storage conditions, and quorum-based approval requiring multiple safety conditions.

questions:
  q1: "How many distinct processing decision scenarios exist across all combinations of sample, environment, and user parameters?"
  q2: "Can Chemical samples (which create High contamination risk) ever be approved for processing? If yes, under what exact conditions?"
  q3: "Can samples in the temperature dead zone (0-2°C or 8-10°C for refrigerated samples) ever be directly approved for processing?"
