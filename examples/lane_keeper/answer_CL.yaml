model: "lane_keeper"
q1:
  question: "How many distinct lane keeping control scenarios exist?"
  answer: "498 scenarios"
  key_thresholds:
    time_of_day: [6, 12, 18, 20]
    sensor_confidence: [70, 75, 90, 95]
    speed: [40]
    lane_offset: [25, 28, 32, 35]
    driver_intervention_time: [15]
    obstacle_distance: [48, 52]
    dead_zone: "obstacle=48-52, speed=38-42, offset=28-32"
  metadata:
    extraction: 'jq ".[0].regions_str | length" decomp_q1_scenarios.json'
q2:
  question: "Can ManualOverride trigger due to close obstacle?"
  answer: "YES - 36 scenarios where close obstacle triggers ManualOverride"
  example:
    scenario: "Degraded camera + obstacle < 30m + speed 20-39 km/h"
    constraints: ["obstacle_distance < 30", "speed >= 20", "camera_status = Degraded"]
    result: "control_mode = ManualOverride"
  why_counterintuitive: "Even with degraded (not failed) sensors, close obstacles force manual override. Safety distance calculation (base × speed factor) makes proximity critical even at moderate speeds."
  metadata:
    extraction: 'jq "[.[0].regions_str[] | select(.model_eval_str == \"true\")] | length" decomp_q2_low_speed_brake.json'
q3:
  question: "Can the safety property 'Clear weather + Active sensors with good conditions allow driving' be violated?"
  answer: "PROVEN - Property always holds"
  property: "(Clear && Active sensors && obstacle > 40 && lane_offset < 25 && intervention <= 15) ==> (FullAutonomous OR AssistedDriving)"
  why_holds: "With ideal conditions (good visibility, no close obstacles, centered in lane, driver engaged), system always allows at least assisted driving"
  metadata:
    extraction: 'jq ".[0].proved" vg_q3_safety.json'
    note: "Uses formal verification (verify) to prove safety property"
analysis_metadata:
  total_regions: 498
  imandra_runtime: "All analyses completed successfully within 60s"
  pattern_complexity:
    override: "Clear weather allows operation, BUT night + degraded sensors blocks it"
    multiplexer: "Safety distance = base(weather) × speed_factor: Clear=10/Rain=15, then ×1.3 for speed>40"
    dead_zone: "obstacle∈[48,52] AND speed∈[38,42] AND offset∈[28,32] → invalid"
  interesting_findings:
    - "498 distinct scenarios from simplified state space (2 sensor_status × 2 sensor_status × 2 weather × focused int ranges)"
    - "36 scenarios where close obstacle forces manual override"
    - "Safety property proven: good conditions always allow driving"
    - "Override pattern: night + degraded sensors blocks even clear weather"
