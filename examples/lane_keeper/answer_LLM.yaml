      "allow driving" as the system choosing FULL_AUTONOMOUS or ASSISTED_DRIVING (not
      MANUAL_OVERRIDE)

      - With Clear weather and both sensors Active: sensor_conf = 95, visibility_acceptable
      = True (since sensor_conf 95 ≥ 70, even at night the not(night and degraded)
      check passes because degraded is False)

      - However, the system can still go to MANUAL_OVERRIDE via:
        1. close_obstacle: if obstacle_distance < safe_dist and speed > 15
        2. needs_manual: if driver_intervention_time > 15 (regardless of sensor status,
      because the OR condition includes long_intervention)
        3. invalid state: if the obstacle_distance/speed/lane_offset values are in
      dead zone or out of bounds
      - So the property IS violated when these override conditions apply

      - The key insight is that _requires_manual_override uses OR logic: both_degraded
      OR long_intervention — so even with perfect sensors, a long driver intervention
      time (>15s) triggers manual override

      - This is arguably the most subtle violation: the quorum-based override doesn't
      just check sensor health, it also independently checks driver intervention time

      - The property holds reliably when: valid state, no close obstacle, and driver_intervention_time
      ≤ 15
