model: "lane_keeper"
core_function: "determine_lane_keeping_control"
description: >
  An autonomous vehicle lane keeping controller that determines the appropriate control mode (FullAutonomous, AssistedDriving, EmergencyBraking, ManualOverride) based on sensor status, weather conditions, obstacle distance, vehicle speed, and driver intervention time. The system must handle sensor fusion confidence, weather-dependent safety distances, visibility constraints with time-of-day interactions, and emergency situations. The core challenge lies in the override pattern where clear weather allows operation EXCEPT at night with degraded sensors, multiplexer logic where safety distances vary by weather and speed, and quorum-based manual override requirements.

questions:
  q1: "How many distinct lane keeping control scenarios exist in determine_lane_keeping_control, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can ManualOverride trigger when obstacle is close? Under what conditions?"
  q3: "Can the safety property 'Clear weather + Active sensors with good conditions allow driving' ever be violated?"
