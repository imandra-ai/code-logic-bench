model: "last_mile_delivery_network"
core_function: "determine_vehicle_assignment"
description: >
  Last-mile delivery vehicle assignment system that determines whether to assign, waitlist, or reject package assignments to delivery vehicles (Truck, Drone, Robot) based on battery levels, capacity constraints, distance requirements, package priority, and weather conditions. The model implements emergency override for critical deliveries, weather-dependent vehicle compatibility, battery dead zones for different vehicle types, and quorum-based assignment requiring multiple operational conditions.

questions:
  q1: "How many distinct vehicle assignment decision scenarios exist across all combinations of vehicle, package, and environment parameters?"
  q2: "Can Drones ever be assigned deliveries during Storm weather? If yes, under what exact conditions?"
  q3: "Can vehicles in their battery dead zone ever be directly assigned to deliveries?"
