model: "learning_path_recommender"
core_function: "determine_module_recommendation"
description: >
  Learning path recommendation system that determines whether to recommend, defer, or exclude educational modules for students based on competency levels, learning style preferences, goal alignment, engagement scores, and module difficulty. The model implements high-priority goal override for critical learning objectives, difficulty-dependent prerequisite thresholds, competency dead zones near threshold boundaries, and quorum-based recommendation scoring.

questions:
  q1: "How many distinct module recommendation decision scenarios exist across all combinations of module, student, and goal parameters?"
  q2: "Can Expert-level modules (requiring 80% competency) ever be recommended to students with competency below 80%? If yes, under what exact conditions?"
  q3: "Can modules be directly recommended when student competency is in the dead zone (±5% around difficulty threshold)?"
