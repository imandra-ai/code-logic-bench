      = max_capacity - 2.


      2. **"At the reduced capacity limit"** means current_vessel_count == effective_capacity.
      The check is `current_vessel_count < effective_capacity`, which is **False**
      when equal. So **capacity_ok = False**.


      3. **No dead zone**: Dead zone only applies during FOG with visibility 450-550m.
      Storm weather → no dead zone.


      4. **No emergency override**: Cargo vessels are not EMERGENCY type, so emergency_override
      returns False.


      5. **Quorum-based approval** (need 3 out of 5):
         - capacity_ok = **False** (at the limit)
         - speed_ok = vessel_speed ≤ (speed_limit × 40) // 100 (Storm reduces to 40%)
         - priority_ok = vessel_priority ≥ 1 (Cargo priority score is 1)
         - fuel_ok = fuel_level ≥ 30
         - spacing_ok = visibility ≥ 500

