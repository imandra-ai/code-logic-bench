model: "maritime_vessel_traffic"
core_function: "determine_lane_entry"
description: >
  Maritime vessel traffic management system that determines whether to approve, delay, or deny vessel entry into shipping lanes based on vessel type and priority, current lane occupancy, weather conditions, visibility, and safety constraints. The model implements emergency vessel override for urgent situations, weather-dependent capacity and speed adjustments, visibility dead zones during marginal fog conditions, and quorum-based entry approval.

questions:
  q1: "How many distinct lane entry decision scenarios exist across all combinations of vessel, lane, and environment parameters?"
  q2: "Can Cargo vessels enter a lane when it's at the reduced capacity limit during Storm conditions? If yes, under what exact conditions?"
  q3: "Can vessel entries be directly approved when visibility is in the dead zone (450-550m during Fog)?"
