model: "market_maker"
core_function: "determine_quote_decision"
description: >
  Market maker quoting system that determines whether to provide liquidity at full size, reduced size, or stop quoting based on inventory position, volatility regime, adverse selection patterns, market depth, and spread adequacy. The model implements high volatility override for aggressive quoting in favorable conditions, volatility-dependent minimum spreads, position dead zones near risk limits, and quorum-based size determination.

questions:
  q1: "How many distinct quoting decision scenarios exist across all combinations of position, market, and risk parameters?"
  q2: "Can the market maker quote at FullSize when experiencing consecutive adverse selection (≥3 trades)? If yes, under what exact conditions?"
  q3: "Can the market maker quote at FullSize when position is in the dead zone (85-95% of max position)?"
