model: "marketplace_order_fulfillment_system"
core_function: "determine_fulfillment_strategy"
description: >
  Marketplace order fulfillment strategy selection system that determines the optimal shipping method, warehouse zone, and carrier combination based on seller tier (Basic to Enterprise), product category handling requirements, inventory levels, order velocity, customer delivery preferences, cost constraints, and warehouse capacity. The system implements premium seller express overrides for remote inventory, zone-method-carrier multiplexing with extensive compatibility matrices, inventory dead zones during high velocity periods, and quorum-based method selection requiring multiple operational criteria.

questions:
  q1: "How many distinct fulfillment strategy scenarios exist across all combinations of seller, product, inventory, and warehouse parameters?"
  q2: "Can Express shipping ever be selected from Rural warehouses for Food products? If yes, under what exact conditions?"
  q3: "Can Express or SameDay shipping methods be selected when inventory is in the dead zone (stock 18-22 with order velocity ≥8)?"
