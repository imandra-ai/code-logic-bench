model: "multi_agency_emergency_dispatch"
core_function: "determine_dispatch_decision"
description: >
  Multi-agency emergency dispatch system that determines whether to dispatch emergency resources (Ambulance, FireTruck, PoliceUnit, Helicopter, HazmatTeam) to incidents of varying severity and type. The system calculates response times based on resource type, weather conditions, and traffic levels using comprehensive multiplier matrices. It implements life-threatening incident overrides that bypass fuel constraints, priority-dependent minimum fuel requirements, fuel-distance dead zones for marginal situations, and quorum-based dispatch approval requiring multiple operational criteria.

questions:
  q1: "How many distinct emergency dispatch decision scenarios exist across all combinations of incident, resource, and environmental parameters?"
  q2: "Can Helicopters ever be dispatched during Storm weather conditions? If yes, under what exact conditions?"
  q3: "When fuel level is in the dead zone (25-35%) with moderate distance (15-25 units), does the system always require backup resources?"
