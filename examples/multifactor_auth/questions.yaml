model: "multifactor_auth"
core_function: "determine_auth_result"
description: >
  A multi-factor authentication system that determines authentication outcomes based on user status, device trust, password correctness, TOTP correctness, failed attempts, MFA requirements, and operation sensitivity. The system enforces account lockout, step-up authentication, and trusted device policies.

questions:
  q1: "How many distinct authentication outcome scenarios exist across all user states and authentication factors?"
  q2: "Can authentication be granted when requires_mfa=true but totp_correct=false?"
  q3: "When failed_attempts equals max_failed_attempts exactly, does lock_account always trigger?"
