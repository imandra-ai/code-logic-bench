model: "npc_pathfinding"
core_function: "determine_path_validity"
description: >
  An NPC pathfinding validation system that determines path validity based on NPC type, terrain, obstacles, stuck state, and replanning needs. Different NPC types have different terrain traversal capabilities and movement speeds.

questions:
  q1: "How many distinct pathfinding scenarios exist across all NPC types and terrain conditions?"
  q2: "Can Civilian NPCs ever successfully path through Water terrain?"
  q3: "When both Civilian and Scout have valid paths through the same terrain, does Scout always have equal or lower estimated_cost?"
