model: "nuclear_reactor_safety_system"
core_function: "determine_safety_response"
description: >
  A nuclear reactor safety system that continuously monitors critical parameters (core temperature, primary pressure, neutron flux, radiation levels, xenon poisoning, and time since last SCRAM) and determines appropriate safety responses. The system must balance operator control with automatic safety protocols, respecting regulatory limits while allowing operational flexibility. When parameters exceed safety thresholds, the system classifies severity and decides whether to initiate SCRAM (emergency reactor shutdown), activate the Emergency Core Cooling System (ECCS), or isolate containment. The core challenge lies in the interaction between: (1) operator overrides with nested exception logic, (2) automatic safety triggers based on complex quorum logic (requiring 2+ critical conditions, with time-dependent threshold lowering), (3) special parameter combinations that bypass normal thresholds, (4) measurement dead zones where sensor readings are ambiguous, and (5) context-dependent threshold semantics (xenon level changes meaning of temperature). This creates exponential complexity: 7,714 distinct scenarios with multiple shadowed code branches that look reachable but are mathematically impossible.

questions:
  q1: "How many distinct safety response scenarios exist in determine_safety_response, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Under what exact conditions does the system initiate automatic SCRAM (emergency shutdown)? Describe the logical structure of how these conditions combine, including any operator override interactions."
  q3: "Can the safety property 'Critical temperature (≥650°C) always triggers SCRAM when safety system is operational' ever be violated? If so, under what exact conditions? Include any edge cases or boundary conditions where violations might occur."
