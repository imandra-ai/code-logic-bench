model: "options_market_maker"
core_function: "determine_quote_decision"
description: >
  An options market maker quoting system that determines whether to provide quotes based on option type, moneyness, volatility regime, days to expiry, delta exposure, and inventory position. The system enforces risk limits and adjusts quoting behavior in high-risk conditions.

questions:
  q1: "How many distinct quoting scenarios exist across all option types and market conditions?"
  q2: "Can provide_quote=true ever occur when delta_pct > max_delta_pct (delta limit exceeded)?"
  q3: "When volatility is Extreme (vol_bps >= 5000) AND days_to_expiry <= 7, can provide_quote ever be true?"
