model: "procedural_dungeon_generator"
core_function: "determine_room_placement"
description: >
  A procedural dungeon room placement system that validates room placements based on room type, difficulty tier, distance from entrance, existing room counts, and combat room prerequisites. The system enforces distance constraints, sequence requirements, and room count limits.

questions:
  q1: "How many distinct room placement scenarios exist across all room types and difficulty tiers?"
  q2: "Can a Boss room ever be placed at distance_from_entrance < 8? If yes, under what conditions?"
  q3: "For Boss room placement, does having distance ∈ [8,15] and existing_combat_count >= 3 always result in Approved placement?"
