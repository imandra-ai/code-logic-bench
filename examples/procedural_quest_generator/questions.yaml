model: "procedural_quest_generator"
core_function: "determine_quest_availability"
description: >
  A procedural quest generation system that determines quest availability based on complex interactions between faction politics, player class capabilities, reputation systems, and resource management. The system handles nested override logic (RivalFaction with class-specific exceptions, HostileEmpire with quest-type exceptions), reputation overflow dead zones, faction-specific reputation multipliers, class-dependent difficulty thresholds, weighted quorum conditions, time-of-day restrictions, and exploitable edge cases that trigger anti-cheat blocks.

questions:
  q1: "How many distinct quest availability scenarios exist for RivalFaction quests specifically, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can HostileEmpire ever offer FetchQuests (i.e., result in FullyAvailable, ConditionalUnlock, or HiddenQuestline)? Under what exact conditions?"
  q3: "For HostileEmpire quests with reputation=90 and completed_faction_quests≥10 (meeting hidden questline requirements), does this ALWAYS result in HiddenQuestline for non-FetchQuest types? Or can other factors prevent it?"
