model: "quadcopter_stabilization_controller"
core_function: "determine_control_mode"
description: >
  A quadcopter flight control system that determines control mode approval based on flight mode, battery level, tilt angle, altitude, and sensor health. The system enforces emergency landing for critical conditions and restricts autonomous modes when sensors are degraded or battery is low.

questions:
  q1: "How many distinct control decision scenarios exist across all flight modes?"
  q2: "Can autonomous flight modes (AltHold, Hover, ReturnHome) ever be approved when battery_pct < 30 (low battery)?"
  q3: "Does battery_pct < 15 (critical battery) always trigger force_emergency_landing=true?"
