model: "real_time_payment_fraud_detector"
core_function: "determine_fraud_decision"
description: >
  A real-time payment fraud detection system that evaluates transaction risk based on merchant category, amount, device trust level, transaction time, account age, and recent activity velocity. The system calculates risk scores using category- specific base scores with device and time multipliers, checks for suspicious velocity patterns, and determines whether to allow, require 2FA, or flag for review. The core challenge involves override patterns where large amounts trigger review EXCEPT for trusted long-term accounts, multiplexer logic where risk calculations vary by category and time, and quorum-based velocity checks.

questions:
  q1: "How many distinct fraud decision scenarios exist, and what are the key thresholds?"
  q2: "Can Casino category transactions ever be allowed? Under what conditions?"
  q3: "Can large amounts (>1000) avoid being flagged for review?"
