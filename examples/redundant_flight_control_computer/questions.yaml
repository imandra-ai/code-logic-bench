model: "redundant_flight_control_computer"
core_function: "determine_flight_control"
description: >
  A triple-redundant flight control system that determines which computers to use and when pilot intervention is required based on computer status, flight phase, sensor agreement, and altitude. The system implements quorum-based operation (requires 2+ operational computers), phase-specific confidence requirements, and override logic for critical phases.

questions:
  q1: "How many distinct control scenarios exist?"
  q2: "Can Landing phase operate without pilot intervention?"
  q3: "Can system use computers with 1 Failed computer?"
