model: "satellite_constellation_controller"
core_function: "determine_maneuver_approval"
description: >
  A satellite constellation maneuver control system that determines whether to approve orbital maneuvers based on system mode, battery level, communication link status, fuel remaining, and required delta-v. The system selects appropriate thrusters and enforces emergency overrides for debris avoidance.

questions:
