model: "semiconductor_fab"
core_function: "determine_process_approval"
description: >
  A semiconductor fabrication cleanroom control system that determines whether to approve wafer processing based on process step, wafer priority, chamber contamination level, tool status, maintenance state, and temperature. The system enforces strict cleanroom class requirements with critical priority overrides.

questions:
  q1: "How many wafer processing scenarios exist for Photolithography (the most contamination-sensitive process step)?"
  q2: "Can wafer processing ever be approved when chamber_contamination = Class100 (relatively dirty)?"
  q3: "For Photolithography with Critical priority, does chamber_contamination = Class10 always result in approval when tool is Available with maintenance_cycles < 100 and temperature <= 150?"
