  q2:
    answer: >-
      The system selects **Emergency mode** under exactly one set of conditions:


      **Emergency mode IS selected when:**

      - `emergency_state == EmergencyState.FIRE_ALARM`

      - AND NOT (`battery_level < 10` AND `maintenance_hours > 10000`)

      - i.e., either `battery_level >= 10` OR `maintenance_hours <= 10000` (or both)


      When these conditions hold, the mode is set to Emergency (fan_speed=100), and
      this mode is **never downgraded** by energy constraints (explicitly protected
      in Step 4).


      The `requires_override` flag is set to `true` if `maintenance_hours > 10000`
      (since emergency_state != NoEmergency), and `false` otherwise.


      **Emergency override is PREVENTED (sub-exception) when:**

      - `emergency_state == EmergencyState.FIRE_ALARM`

      - AND `battery_level < 10` (critical battery)

      - AND `maintenance_hours > 10000` (overdue maintenance)


      In this case, the system selects **Off** instead of Emergency, with `requires_override
      = true` (both conditions of the override check are satisfied: final_mode is
      Off with FireAlarm active, and maintenance_hours > 10000 with non-NoEmergency
      state).


      **Important notes:**

      - MaintenanceMode does NOT produce Emergency mode — it produces either Off or
      Ventilation.

      - NoEmergency never produces Emergency mode — it passes through the base_mode
      unchanged.

      - Emergency mode, once selected, is immune to energy constraint downgrading
      (the code explicitly checks `if mode_after_emergency == HVACMode.EMERGENCY:
      final_mode = HVACMode.EMERGENCY`).
    reasoning: >-
      - In `apply_emergency_mode`, only `EmergencyState.FIRE_ALARM` can produce `HVACMode.EMERGENCY`.

      - The FireAlarm branch has a sub-exception: if `battery_level < 10` AND `maintenance_hours
      > 10000`, it returns Off instead of Emergency.

      - Otherwise (battery >= 10 OR maintenance <= 10000), FireAlarm returns Emergency.

      - MaintenanceMode returns either Ventilation (battery >= 50 and maintenance
      < 9000) or Off — never Emergency.

      - NoEmergency returns the base_mode, which can be Off, Ventilation, Heating,
      or Cooling — never Emergency.

      - In Step 4, Emergency mode is explicitly protected from energy constraint downgrading.

      - The override flag for the FireAlarm sub-exception case (Off) is true because:
      (1) final_mode == Off and emergency_state == FireAlarm is true, and (2) maintenance_hours
      > 10000 and emergency_state != NoEmergency is also true.
  q3:
    answer: >-
      **No, the safety property is NEVER violated.** The property states: "During
      a FireAlarm, the system must either select Emergency mode or be Off with manual
      override required." This holds in all cases.


      **Proof by exhaustive case analysis:**


      During FireAlarm (`emergency_state == EmergencyState.FIRE_ALARM`), `apply_emergency_mode`
      has exactly two branches:


      **Case 1: battery_level < 10 AND maintenance_hours > 10000**

      - `mode_after_emergency = HVACMode.OFF`

      - Energy constraints: Even if ≥2 energy constraints are active, Off is not changed
      (only Heating/Cooling are downgraded to Ventilation; Off stays Off).

      - `final_mode = HVACMode.OFF`

      - Override check: `(final_mode == Off AND emergency_state == FireAlarm)` → **True**.
      Also `(maintenance_hours > 10000 AND emergency_state != NoEmergency)` → **True**.
      So `requires_override = True`.

      - **Result: Off with override=True** ✓ (satisfies property)


      **Case 2: battery_level >= 10 OR maintenance_hours <= 10000**

      - `mode_after_emergency = HVACMode.EMERGENCY`

      - Energy constraints: Emergency is explicitly never downgraded (`if mode_after_emergency
      == HVACMode.EMERGENCY: final_mode = HVACMode.EMERGENCY`).

      - `final_mode = HVACMode.EMERGENCY`

      - **Result: Emergency mode** ✓ (satisfies property)


      **Edge cases examined:**

      1. **Dead zone (temp_diff == 3):** Irrelevant — emergency override occurs in
      Step 3 after base_mode calculation but completely replaces the base_mode.

      2. **Boundary: battery_level == 10, maintenance_hours == 10000:** `battery_level
      < 10` is false, `maintenance_hours > 10000` is false → Case 2 → Emergency ✓

      3. **Boundary: battery_level == 9.999, maintenance_hours == 10001:** Both conditions
      true → Case 1 → Off with override ✓

      4. **Energy constraints at maximum (all 3 active):** Cannot downgrade Emergency
      (explicitly protected). Cannot change Off.

      5. **Empty building + FireAlarm:** base_mode = Off, but emergency override replaces
      it → Emergency or Off with override ✓

      6. **Any occupancy/season/temp_diff combination:** All base_modes are overridden
      by the FireAlarm logic in Step 3.


      **The safety property holds unconditionally during FireAlarm.** The system's
      design ensures this through: (a) the emergency override completely replacing
      any base mode, (b) Emergency mode being immune to energy downgrading, (c) the
      Off-during-FireAlarm case always setting requires_override=True.
    reasoning: >-
      - During FireAlarm, `apply_emergency_mode` is a complete override — it ignores
      the base_mode entirely and returns either Emergency or Off.

      - The Emergency path: mode_after_emergency = EMERGENCY. In Step 4, the code
      explicitly states `if mode_after_emergency == HVACMode.EMERGENCY: final_mode
      = HVACMode.EMERGENCY` — so energy constraints NEVER downgrade Emergency to Ventilation
      or anything else.

      - The Off path (sub-exception): mode_after_emergency = OFF. In Step 4, Off is
      not Heating or Cooling, so it's not downgraded. Off remains Off.

      - For the Off path, the override check: `(final_mode == HVACMode.OFF and emergency_state
      == EmergencyState.FIRE_ALARM)` evaluates to True. So requires_override = True.

      - There is no code path where FireAlarm leads to Ventilation, Heating, or Cooling
      as the final mode.

      - Boundary conditions (battery_level exactly 10, maintenance_hours exactly 10000)
      use strict inequalities (< 10 and > 10000), so at the boundary the system goes
      to Emergency, which still satisfies the property.

      - The safety property is perfectly upheld by the design — it cannot be violated
      under any input combination.
