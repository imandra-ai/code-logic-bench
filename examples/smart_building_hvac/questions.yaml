model: "smart_building_hvac"
core_function: "determine_hvac_control"
description: >
  A smart building HVAC control system that determines the appropriate operating mode (Off, Ventilation, Heating, Cooling, Emergency) based on temperature differential, occupancy, season, emergency states, and energy constraints. The system must balance comfort, safety, and energy efficiency while handling fire alarm situations with proper override logic. The core challenge involves the interaction between seasonal temperature interpretation (multiplexer pattern), emergency overrides with sub-exceptions (FireAlarm normally forces Emergency, but critical battery + overdue maintenance forces Off instead), temperature dead zones (temp_diff = 3), and quorum-based energy-saving triggers (2 out of 3 conditions) that downgrade operational modes.

questions:
  q1: "How many distinct HVAC control decision scenarios exist in determine_hvac_control, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Under what exact conditions does the system select Emergency mode? Include all scenarios where emergency overrides are active and any sub-cases where emergency override is prevented."
  q3: "Can the safety property 'During a fire alarm (FireAlarm), the system must either select Emergency mode or be Off with manual override required' ever be violated? If so, under what exact conditions? Include any edge cases or boundary conditions where violations might occur."
