model: "smart_contract_supply_chain"
core_function: "determine_contract_validity"
description: >
  A supply chain contract validation system that determines contract approval based on party role, product category, jurisdiction, quality standards, reputation, and payment terms. Pharmaceuticals have mandatory audit requirements and strict FDA compliance.

questions:
  q1: "How many contract validation scenarios exist for Pharmaceuticals?"
  q2: "Can a Pharmaceuticals contract ever be approved without FDA certification?"
  q3: "For approved Pharmaceuticals contracts, must requires_audit always be true?"
