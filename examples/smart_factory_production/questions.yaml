model: "smart_factory_production"
core_function: "determine_production_decision"
description: >
  A factory production control system that determines whether to approve production based on product type, production mode, defect score, temperature, safety level, and vibration. The system enforces emergency stops, quality thresholds, and mode-specific safety limits.

questions:
