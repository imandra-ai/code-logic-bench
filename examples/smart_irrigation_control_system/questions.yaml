model: "smart_irrigation_control_system"
core_function: "determine_irrigation_decision"
description: >
  An irrigation control system that determines whether to irrigate based on crop type, growth stage, soil moisture, sensor status, and water availability. The system has critical stage overrides for Flowering crops that bypass normal safety checks.

questions:
  q1: "How many distinct irrigation decision scenarios exist across all crop types and stages?"
  q2: "Can irrigation ever be approved when sensor_status = Faulty? If yes, under what conditions?"
  q3: "For Flowering stage crops, does critically_dry (moisture < target_min - 20) always trigger irrigation approval?"
