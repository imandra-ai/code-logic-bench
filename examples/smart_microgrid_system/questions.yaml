model: "smart_microgrid_system"
core_function: "determine_load_shedding"
description: >
  A microgrid load shedding system that determines which loads to disconnect during energy shortages. The system prioritizes loads (Critical > Essential > NonEssential > Deferrable) and enforces mode-specific protection rules (GridTied protects Critical, Emergency allows Essential shedding).

questions:
  q1: "How many distinct load shedding scenarios exist across all system modes?"
  q2: "Can Essential loads ever be shed when battery_soc >= 50 (healthy battery state)?"
  q3: "Can Critical loads ever be shed when renewable_kw >= 80 (abundant renewable energy)?"
