model: "smart_warehouse_auto_controller"
core_function: "determine_task_assignment"
description: >
  A warehouse robot task assignment system that determines whether to assign tasks to robots based on robot capability, item type, battery level, efficiency, zone safety, and task priority. The system handles critical priority overrides, safety constraints, and supervision requirements.

questions:
  q1: "How many task assignment scenarios exist for Hazardous items?"
  q2: "Can a task ever be approved when battery_level < 20? If yes, under what conditions?"
  q3: "For Heavy items with TransportRobot, does approved=true always mean requires_supervision=false when humans_in_zone > 0?"
