model: "smart_waste_management_scheduler"
core_function: "determine_collection_decision"
description: >
  A waste collection scheduling system that determines whether to collect from a bin based on fill level, waste type, truck capability, weather conditions, and fuel level. The system handles emergency overrides for Hazardous waste, applies waste-specific thresholds, and adjusts priorities based on weather and fuel constraints.

questions:
  q1: "How many collection scenarios exist for Hazardous waste bins using Hazardous_Only or Multi_Type trucks?"
  q2: "Can a collection ever be approved (approved=true) when fuel_level < 20? If yes, under what conditions?"
  q3: "For Organic waste at exactly 80% fill (threshold boundary), does approval always occur when fuel_level >= 20 and weather is Sunny?"
