      or resumption_policy_ok=False)

      6. cert_status = VALID

      7. security_policy_level < 4

      8. client_group = SECP256R1 (both client and server, since they must match)


      So the complete answer is: can_proceed=True AND forward_secrecy=False occurs
      in exactly two cases:

      - **Case A (Session Resumption):** All early guards pass + has_session_ticket
