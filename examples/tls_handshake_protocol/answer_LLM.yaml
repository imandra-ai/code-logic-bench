      checks that must NOT trigger (i.e., none of the early failure returns are reached),
      and then conditions 6-8 must all be True to enter the session resumption success
      path.


      Importantly, the only other successful outcome (FULL_HANDSHAKE_SUCCESS) sets
      forward_secrecy based on whether client_group == X25519. When client_group ==
      SECP256R1 (forward_secrecy would be False), the function either:

