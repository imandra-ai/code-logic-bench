model: "transportation_risk_manager"
core_function: "determine_route_decision"
description: >
  A transportation risk management system that evaluates route decisions based on transport mode, cargo type, weather conditions, and geopolitical risks. The system handles safety restrictions, assesses route viability, applies mode-specific cost multipliers, and determines emergency routing activation.

questions:
  q1: "How many distinct routing scenarios exist for Sea transport when operating under geopolitical tensions (Tensions, Sanctions, or WarZone)?"
  q2: "Can Air transport ever be rejected for Standard (non-Hazardous) cargo? If yes, under what conditions?"
  q3: "For Air transport specifically, does having both cargo_value > 100000 AND time_critical < 24 always activate emergency routing when the route is approved?"
