model: "urban_air_quality_monitoring_network"
core_function: "determine_monitoring_response"
description: >
  An urban air quality monitoring system that processes sensor readings for five  pollutants (PM2.5, NO2, Ozone, CO, SO2) and determines appropriate alert levels  based on WHO guidelines. The system must account for sensor calibration drift,  weather conditions that affect pollutant dispersion, and equipment status. When  readings exceed safety thresholds, the system classifies the severity (Moderate to  Hazardous) and decides whether to activate emergency response protocols. The core  challenge lies in handling the interaction between sensor faults (which typically  escalate alerts), weather-dependent threshold adjustments, and a quorum-based  emergency trigger that requires multiple risk factors to align before activating  city-wide emergency measures.

questions:
  q1: "How many distinct monitoring response scenarios exist in determine_monitoring_response, and what are the exact numeric thresholds that determine these scenarios?"
  q2: "Can a sensor with status=Calibrating ever trigger an emergency protocol? If so, under what conditions?"
  q3: "Can the safety property 'Hazardous readings with recent alerts always trigger emergency protocol' ever be violated? If so, under what exact conditions? Include any edge cases or boundary conditions where violations might occur."
